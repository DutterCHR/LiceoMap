<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html, #map { height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="map"></div>
<script>
    // Coordenadas iniciales (Centro de Arica / Liceo)
    var map = L.map('map').setView([-18.4783, -70.3126], 18);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Marcador de prueba
    var marker = L.marker([-18.4783, -70.3126]).addTo(map);
    marker.bindPopup("<b>Liceo Antonio Varas</b><br>Entrada Principal").openPopup();
</script>
</body>
</html>

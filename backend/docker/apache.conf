<VirtualHost *:__PORT__>
    ServerName localhost
    DocumentRoot /var/www/liceomap/public
    <Directory /var/www/liceomap/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteRule ^ index.php [END]
    </Directory>
    ErrorLog /proc/self/fd/2
    # Evitar RUT o parámetros sensibles en logs de acceso.
    LogFormat "%a %m %U %>s" liceomap
    CustomLog /proc/self/fd/1 liceomap
</VirtualHost>
